name: Audit sampled GTFS-Realtime raw fields

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobility-r2-raw-backup-verification
  cancel-in-progress: false
  queue: max

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Sample and decode R2 raw data (read-only)
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: mobility-archive-raw
        run: node scripts/analyze-gtfsrt-fields.mjs
