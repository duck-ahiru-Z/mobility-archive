name: Daily mobility archive
on:
  workflow_dispatch:
    inputs:
      archive_date:
        description: 'JST date to process (YYYY-MM-DD)'
        required: false
  schedule:
    - cron: '17 18 * * *' # 03:17 JST, previous JST date is complete
jobs:
  archive:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - name: Checkout data repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/mobility-archive-data
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: data-repo
      - name: Build daily manifest
        env:
          ARCHIVE_DATE: ${{ inputs.archive_date || '' }}
          OUTPUT_DIR: data-repo/archive
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: mobility-archive-raw
        run: |
          if [ -z "$ARCHIVE_DATE" ]; then ARCHIVE_DATE=$(TZ=Asia/Tokyo date -d 'yesterday' +%F); fi
          export ARCHIVE_DATE
          node scripts/daily-archive.mjs
      - name: Commit data repository
        working-directory: data-repo
        run: |
          git config user.name 'mobility-archive-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add archive
          git diff --cached --quiet || git commit -m "data: archive ${ARCHIVE_DATE:-daily}"
          git push
