name: Daily mobility archive
on:
  workflow_dispatch:
    inputs:
      archive_date:
        description: 'JST date to process (YYYY-MM-DD)'
        required: false
  schedule:
    - cron: '17 18 * * *' # 03:17 JST, previous JST date is complete

concurrency:
  group: mobility-archive-data-writer
  cancel-in-progress: false
  queue: max

jobs:
  archive:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - name: Checkout data repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/mobility-archive-data
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: data-repo
      - name: Resolve archive date
        id: archive-date
        env:
          INPUT_ARCHIVE_DATE: ${{ inputs.archive_date || '' }}
        run: |
          if [ -n "$INPUT_ARCHIVE_DATE" ]; then
            ARCHIVE_DATE="$INPUT_ARCHIVE_DATE"
          else
            ARCHIVE_DATE=$(TZ=Asia/Tokyo date -d 'yesterday' +%F)
          fi
          if ! [[ "$ARCHIVE_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo 'Invalid archive_date; expected YYYY-MM-DD.' >&2
            exit 1
          fi
          NORMALIZED_DATE=$(date -u -d "$ARCHIVE_DATE" +%F 2>/dev/null || true)
          if [ "$NORMALIZED_DATE" != "$ARCHIVE_DATE" ]; then
            echo 'Invalid calendar date in archive_date.' >&2
            exit 1
          fi
          echo "date=$ARCHIVE_DATE" >> "$GITHUB_OUTPUT"
          echo "started_at_ms=$(date -u +%s%3N)" >> "$GITHUB_OUTPUT"
      - name: Build daily manifest
        id: build-archive
        env:
          ARCHIVE_DATE: ${{ steps.archive-date.outputs.date }}
          OUTPUT_DIR: data-repo/archive
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: mobility-archive-raw
          ALLOW_PRIVATE_DATASET: 'true'
        run: |
          node scripts/daily-archive.mjs
      - name: Commit data repository
        if: success()
        working-directory: data-repo
        env:
          ARCHIVE_DATE: ${{ steps.archive-date.outputs.date }}
        run: |
          git config user.name 'mobility-archive-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add archive
          git diff --cached --quiet || git commit -m "data: archive ${ARCHIVE_DATE:-daily}"
          git push
      - name: Add operational summary
        if: always()
        env:
          ARCHIVE_DATE: ${{ steps.archive-date.outputs.date || inputs.archive_date || '' }}
          OUTPUT_DIR: data-repo/archive
          JOB_STATUS: ${{ job.status }}
          WORKFLOW_STARTED_AT: ${{ steps.archive-date.outputs.started_at_ms }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/workflows/daily-archive.yml
        run: node scripts/daily-archive-summary.mjs
