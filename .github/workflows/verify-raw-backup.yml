name: Verify reversible R2 raw backup

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobility-r2-raw-backup-verification
  cancel-in-progress: false
  queue: max

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Checkout private daily manifest
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/mobility-archive-data
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: data-repo
      - name: Verify R2 backup round trip in runner temporary storage
        env:
          BACKUP_DATE: '2026-10-09'
          EXPECTED_MANIFEST_PATH: data-repo/archive/2026/10/09/manifest.json
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: mobility-archive-raw
        run: node scripts/r2-backup-verify.mjs
